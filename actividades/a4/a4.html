<!doctype html>
<html>
 <head>
   <meta charset="utf-8">
   <title>Pagina 3</title>
   <style>
       canvas{
           border: 1px solid #0fad44;
           background-color: rgb(183, 246, 231);
       }
   </style>
   <script>
       var x=Math.random() * 800;
       var y=Math.random() * 600;
       var dx=4;
       function animate(){
           requestAnimationFrame(animate);
           var canvas = document.getElementById("micanvas");
           var context = canvas.getContext("2d");
           context.clearRect(0, 0, innerWidth, innerHeight);
           //console.log('animando');
           //context.font = '40pt Calibri';
           // context.fillStyle = 'blue';
           // context.fillText('Hello World!', x, y);

            context.fillStyle = 'pink';
           context.fillRect(x + 80,250,60,30);

            context.fillStyle = 'green';
           context.fillRect(x + 40,140,220,60);
           
            context.fillStyle = 'green';
           context.fillRect(x + 60,100,50,60);

            context.fillStyle = 'green';
           context.fillRect(x + 90,120,50,60);

            context.fillStyle = 'green';
           context.fillRect(x + 135,100,50,60);

            context.fillStyle = 'green';
           context.fillRect(x + 210,100,30,60);

            context.fillStyle = 'green';
           context.fillRect(x + 180,120,30,30);

            context.fillStyle = 'red';
           context.fillRect(x,200,300,100);
            
           context.fillStyle = 'red';
           context.fillRect(x,300,300,100);
          
           context.fillStyle = 'red';
           context.fillRect(x + 50,400,200,100);

            context.fillStyle = 'red';
           context.fillRect(x + 100,470,100,100);

            if (x > 600 || x < 0){
                dx= -dx;
            }
           x+=dx;
           
       }
       animate();
   </script>
   </head>
 <body>
    <canvas id="micanvas" width="800" height="600"></canvas>
 </body>
</html>
