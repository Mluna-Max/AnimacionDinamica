<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mariposita - Animación Senoidal</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
      }
        body {
      background-color: rgb(145, 247, 160);
      text-align: center;
    }
      h1 {
        color: rgb(254, 255, 192);
        text-align: center;
        margin-bottom: 20px;
      }

      canvas {
        border: 1px solid black;
        background-color: rgb(111, 212, 255);
      }

      p {
        font-family: verdana;
        font-size: 20px;
      }
    </style>
  </head>

  <body>

    <h1>Mira la hermosa mariposa</h1>

    <canvas id="canvas" width="700" height="600"></canvas>

    <script>

      window.onload = function () {

        var canvas = document.getElementById('canvas'),
            context = canvas.getContext('2d'),

            ball = {
              x: 0,
              y: 0
            },

            angle = 0,
            centerX = canvas.width / 2,
            centerY = canvas.height / 2,
            radius = 150,
            speed = 0.05;


        // Cargar la imagen
        var image = new Image();
        image.src = "mariposita.png";


        image.onload = function () {

          function drawFrame () {

            requestAnimationFrame(drawFrame);

            context.clearRect(0, 0, canvas.width, canvas.height);


            // POSICIÓN
            // Seno y coseno controlan la posición

            ball.x = centerX + Math.sin(angle) * radius;
            ball.y = centerY + Math.cos(angle) * radius;
            angle += speed;


            // ESCALA
            // La onda senoidal modifica el tamaño

            var scale = 1 + Math.sin(angle) * 0.5;


            // Guardamos el estado del canvas
            context.save();


            // Movemos el canvas a la posición de la mariposa
            context.translate(ball.x, ball.y);


            // Aplicamos la escala
            context.scale(scale, scale);


            // Dibujamos la mariposa centrada
            context.drawImage(
              image,
              -image.width / 2,
              -image.height / 2
            );


            // Restauramos el canvas
            context.restore();

          }


          // Iniciar animación
          drawFrame();

        };

      };

    </script>

  </body>
</html>
