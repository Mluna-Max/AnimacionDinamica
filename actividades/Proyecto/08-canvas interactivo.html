<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Proyecto Parcial 1</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body { 
        text-align: center;
        background-color:rgb(166, 222, 178);
      }
      canvas {
        background-color:rgb(195, 244, 216);
        background-image: url("background.jpg");
        background-size: cover;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1000" height="800"></canvas>
    <aside> </aside>
    
    <script src="keycodes.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById("canvas");
      var context = canvas.getContext("2d");
      var x = 300;
      var y = 200;
      context.font = '30pt verdana';
      context.fillStyle = 'blue';
      context.fillText('Canvas Interactivo', x, y); //<== para poner texto en el canvas

      var imagen= new Image(); // variable para guardar la imagen
      imagen.src = "otraladybug.jpg"; // fuente de donde toma la imagen
      imagen.onload = function(){
        context.drawImage(imagen, x, y+100, 400, 275); //<== para poner imagen en el canvas
      };

      var imagen1= new Image();
      imagen1.src = "aleliesflor.jpg";

      var imagen2= new Image();
      imagen2.src = "gerberaflor.jpg";

      var imagen3= new Image();
      imagen3.src = "clavelflor.jpg";

      var imagen4= new Image();
      imagen4.src = "ladybug.jpg";

          const innerWidth = window.innerWidth;
          const innerHeight = window.innerHeight;

      function onKeyboardEvent (event) {
        switch (event.keyCode) {
        case keyCode.UP:
          console.log("up!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          y-=25;
          context.drawImage(imagen, x, y+50, 300, 200); 
          context.fillText('Up!', x+120, y);
          break;
        case keyCode.DOWN:
          console.log("down!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          y+=25;
          context.drawImage(imagen, x, y+50, 300, 200); 
          context.fillText('Down!', x+80, y);
          break;
        case keyCode.LEFT:
          console.log("left!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          x-=25;
          context.drawImage(imagen, x, y+50, 300, 200); 
          context.fillText('Left!', x+110, y);
          break;
        case keyCode.RIGHT:
          console.log("right!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          x+=25;
          context.drawImage(imagen, x, y+50, 300, 200); 
          context.fillText('Right!', x+90, y);
          break;
        case keyCode.SPACE:
          console.log("Jump!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.drawImage(imagen4, 0, 0, 1000, 800); 
          context.fillText('LADYBUG!', 350, 100);
          break;
         case keyCode.A:
         console.log("Letra A");
          context.clearRect(0, 0, innerWidth, innerHeight);
           context.fillText('Alelies', x + 45, y);
            // Ancho deseado y cálculo proporcional del alto
            const ancho = 300;
            const alto = (imagen1.naturalHeight / imagen1.naturalWidth) * ancho;

            context.drawImage(imagen1, x, y + 100, ancho, alto); 
            break;
        case keyCode.B:
          console.log("Letra B");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.fillText('Gerbera', x+40, y);
          context.drawImage(imagen2, x, y+50, 300, 350); 
          break;
        case keyCode.C:
        case keyCode.C:
      console.log("Letra C");
      context.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Configurar y centrar el texto en el canvas
      context.textAlign = 'center';
      const textX = canvas.width / 2;
      context.fillText('Clavel', textX, 100);

      // 2. Calcular dimensiones proporcionales
      const anchoDeseado = 300;
      const altoProporcional = (imagen3.naturalHeight / imagen3.naturalWidth) * anchoDeseado;

      // 3. Centrar respecto al ancho REAL del canvas
      const imageX = (canvas.width - anchoDeseado) / 2;

      // 4. Dibujar dentro de los límites
      context.drawImage(imagen3, imageX, 150, anchoDeseado, altoProporcional); 
      break;
        default:
          console.log(event.keyCode);
        }
      }

      window.addEventListener('keydown', onKeyboardEvent, false);
    };
    </script>
  </body>
</html>
