<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menú de actividades</title>
    <style>
        head {
            font-family: Verdana;
            color: DarkGreen;
            padding: 20px;
            text-align: center;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #E7DD6A;
            margin: 0;
            padding: 0;
        }
        h1 {
            font-size: 36px;
            color: #E36D9B;
            text-align: center;
            margin-top: 0px;
            padding-top: 35px;
        }
        p {
            text-align: center;
            font-size: 24px;
            color: #E36D9B;
            line-height: 50px;
        }
        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        .column {
            text-align: center;
        }
        h2 {
            font-size: 28px;
            color: #E7DD6A;
        }
        .assignment {
            background-color: #E36D9B;
            padding: 20px;
            margin: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .assignment:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        a {
            display: inline-block;
            background-color: #10B183;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.2s;
        }
a:hover {
            background-color: #A0CB75;
            transform: scale(1.05);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            margin-top: 50px;
            padding: 40px;
            background-color: #A0CB75;
            border: 5px solid #E36D9B;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Menú de actividades</h1>

            <div class="columns">

                <div class="column">
                    <div class="assignment">
                        <h2>Part #1</h2>
                        <a href="actividades/a1/a1.html">Part 1</a>
                    </div>

                    <div class="assignment">
                        <h2>Assignment #2</h2>
                        <a href="actividades/a2/a2.html">Asignacion 2</a>
                    </div>

                    <div class="assignment">
                        <h2>Assignment #3</h2>
                        <a href=".html">Asignacion 3</a>
                    </div>
                </div>

            <div class="column">
                <div class="assignment">
                    <h2>Part #2</h2>
                    <a href=".html">Part 2</a>
                </div>

                <div class="assignment">
                    <h2>Assignment #5</h2>
                    <a href=".html">Asignacion 5</a>
                </div>

                <div class="assignment">
                    <h2>Assignment #6</h2>
                    <a href=".html">Asignacion 6</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
